schema_version: "0.1.0"
harness:
  name: broken-reference-gc-fixture
  failure_taxonomy: examples/missing-taxonomy.yaml
engines:
  cli: ">=0.1 <0.2"
  schemas:
    harness: ">=0.1 <0.2"
    approval-policy: ">=0.1 <0.2"
    sandbox-policy: ">=0.1 <0.2"
    environment: ">=0.1 <0.2"
    failure-taxonomy: ">=0.1 <0.2"
    continuity-state: ">=0.1 <0.2"
    self-verification: ">=0.1 <0.2"
    doctor-result: ">=0.1 <0.3"
    health-result: ">=0.1 <0.3"
    eval-task: ">=0.1 <0.2"
    trace: ">=0.1 <0.2"
    run-result: ">=0.1 <0.2"
    verifier-result: ">=0.1 <0.2"
    scoreboard: ">=0.1 <0.2"
    judge-policy: ">=0.1 <0.2"
    judge-result: ">=0.1 <0.2"
    gc-evidence: ">=0.1 <0.2"
    recurring-profile: ">=0.1 <0.2"
    profile-run: ">=0.1 <0.2"
context:
  maps:
    - README.md
environment: examples/environments/local.yaml
approval_policy: examples/policies/approval-policy.yaml
sandbox: examples/policies/sandbox-policy.yaml
traces:
  output_dir: .harness/traces
evals:
  suites:
    - id: harness-self-test
      version: "1.0.0"
      tasks: examples/evals/harness-self-test/v1.0.0/
  run_results: .harness/run-results.jsonl
  scoreboards: .harness/scoreboards
doctor:
  checks:
    - builtin:schema-validity
continuity:
  state_dir: .harness/continuity
  startup_smoke_test:
    command: harness validate
    timeout_seconds: 300
  handoff_dir: .harness/handoffs
gc:
  evidence_dir: .harness/gc
