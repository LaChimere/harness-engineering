schema_version: "0.1.0"
runner_id: inline-secret
model_profile: examples/model-profiles/stub.yaml
prompt_adapter:
  kind: raw
  template: examples/prompts/stub-task.md
tool_adapter:
  kind: none
  policy: examples/policies/approval-policy.yaml
task_input: examples/evals/harness-self-test/v1.0.0/task.yaml
sandbox: examples/policies/sandbox-policy.yaml
approval_policy: examples/policies/approval-policy.yaml
trace_output: .harness/traces
credential_reference:
  source: env
  name: MODEL_API_KEY
  purpose: live model access
  scope: per-run
  secret_value: sk-inline-secret-is-not-allowed
budgets:
  max_cost_usd: 1
  max_total_tokens: 1024
  max_requests: 1
  enforcement: hard
  scope: per-run
timeout_seconds: 300
verifier_binding:
  eval_task: examples/evals/harness-self-test/v1.0.0/task.yaml
  verifier: examples/evals/harness-self-test/v1.0.0/task.yaml#/verifier
