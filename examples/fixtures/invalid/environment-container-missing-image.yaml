schema_version: "0.1.0"
environment_id: container-without-image
isolation:
  kind: container
  assurance: high
resources:
  cpu: 2
  memory_mb: 4096
  timeout_seconds: 1800
dependencies:
  lockfiles: []
  tools:
    - name: node
      version: ">=20 <21"
startup:
  - command: test -f examples/harness.yaml
    timeout_seconds: 30
health_check:
  - command: git --no-pager status --short
    timeout_seconds: 30
teardown:
  - command: git clean -fdX .harness/tmp
    timeout_seconds: 60
