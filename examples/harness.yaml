schema_version: "0.1.0"
harness:
  name: harness-engineering
  description: Harness-as-code platform for AI coding agents.
  failure_taxonomy: examples/failure-taxonomy.yaml
engines:
  cli: ">=0.1 <0.2"
  schemas:
    harness: ">=0.1 <0.2"
    approval-policy: ">=0.1 <0.2"
    sandbox-policy: ">=0.1 <0.2"
    environment: ">=0.1 <0.2"
    model-profile: ">=0.1 <0.2"
    failure-taxonomy: ">=0.1 <0.2"
    continuity-state: ">=0.1 <0.2"
    self-verification: ">=0.1 <0.2"
    doctor-result: ">=0.1 <0.2"
    health-result: ">=0.1 <0.2"
    eval-task: ">=0.1 <0.2"
    agent-runner: ">=0.1 <0.2"
    runner-readiness: ">=0.1 <0.2"
    trace: ">=0.1 <0.2"
    run-result: ">=0.1 <0.2"
    verifier-result: ">=0.1 <0.2"
    scoreboard: ">=0.1 <0.2"
    judge-policy: ">=0.1 <0.2"
    judge-result: ">=0.1 <0.2"
    gc-evidence: ">=0.1 <0.2"
    recurring-profile: ">=0.1 <0.2"
    profile-run: ">=0.1 <0.2"
context:
  maps:
    - AGENTS.md
    - README.md
environment: examples/environments/local.yaml
approval_policy: examples/policies/approval-policy.yaml
sandbox: examples/policies/sandbox-policy.yaml
model_profiles:
  default: examples/model-profiles/stub.yaml
agent_runners:
  default: examples/agent-runners/stub.yaml
traces:
  output_dir: .harness/outputs/traces
  examples:
    - examples/traces/native-cli-trace.json
    - examples/traces/external-import.json
evals:
  suites:
    - id: harness-self-test
      version: "1.0.0"
      tasks: examples/evals/harness-self-test/v1.0.0/
  run_results: .harness/outputs/run-results.jsonl
  scoreboards: .harness/outputs/scoreboards
judges:
  policies:
    - examples/judges/policy.yaml
doctor:
  checks:
    - builtin:schema-validity
    - builtin:engine-compatibility
    - builtin:reference-exists
    - id: local-doc-link-check
      path: examples/checks/doc-links.yaml
      trust_requirements:
        trust_level: sandboxed
        sandbox_required: process
        network_access: false
        secret_access: false
        host_file_access: false
        allowed_inputs:
          - README.md
          - AGENTS.md
        allowed_outputs:
          - .harness/outputs/doctor/doc-links.json
health:
  output_dir: .harness/outputs/health
  checks:
    - id: docs-present
      command:
        command: test -f README.md && test -f AGENTS.md
        timeout_seconds: 30
      trust_requirements:
        trust_level: sandboxed
        sandbox_required: process
        network_access: false
        secret_access: false
        host_file_access: false
        allowed_inputs:
          - README.md
          - AGENTS.md
        allowed_outputs:
          - .harness/outputs/health
      artifacts:
        - path: README.md
          media_type: text/markdown
          description: User-facing project README.
        - path: AGENTS.md
          media_type: text/markdown
          description: Agent instruction file.
continuity:
  state_dir: .harness/outputs/continuity
  startup_smoke_test:
    command: harness validate
    timeout_seconds: 300
  handoff_dir: .harness/outputs/handoffs
  session_id_env: HARNESS_SESSION_ID
gc:
  evidence_dir: .harness/outputs/gc
recurring_profiles:
  output_dir: .harness/outputs/profile-runs
  profiles:
    - examples/profiles/gc-stability.yaml
