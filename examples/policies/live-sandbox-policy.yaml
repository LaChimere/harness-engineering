schema_version: "0.1.0"
policy_id: live-container-sandbox
tier: container
enforcement:
  mechanism: external-container-runtime
  notes: Readiness fixture for future live runners; no live command execution is performed.
network:
  mode: restricted
  allowlist:
    - api.example.invalid
filesystem:
  allowed_paths:
    - .
    - .harness
  denied_paths:
    - ~/.ssh
process:
  allow_spawn: true
  max_processes: 32
secrets:
  allowed_env_vars:
    - HARNESS_LIVE_API_KEY
  allowed_secret_refs: []
