schema_version: "0.1.0"
x-stability: provisional
action_id: advisory-cli-redirect
target_files:
  - examples/harness.yaml
risk_class: low
repair_mode: advisory-only
equivalent_cli_command:
  command: harness migrate --dry-run --output .harness/repairs/advisory-cli-redirect.yaml
  timeout_seconds: 300
approval_state: proposed
sandbox_requirement: worktree
trust_requirements:
  trust_level: sandboxed
  sandbox_required: worktree
  network_access: false
  secret_access: false
  host_file_access: false
  allowed_inputs:
    - examples/harness.yaml
  allowed_outputs:
    - .harness/repairs/advisory-cli-redirect.yaml
rollback_notes: No host write is executed; discard the generated CLI repair evidence if the proposal is rejected.
evidence_links:
  - path: examples/adapters/github-copilot-cli/adapter-scope.json
    media_type: application/json
    description: Limited-adapter scope declaring advisory-only repair behavior.
advisory:
  reason: The limited adapter redirects repairs to equivalent harness CLI commands instead of executing host-surface writes.
  write_execution: cli-only
  approval_guidance: Review risk class, approval policy, and generated CLI preview evidence before running any write command.
