schema_version: "0.1.0"
x-stability: provisional
action_id: approved-schema-fix
target_files:
  - examples/fixtures/invalid/harness-with-plugin-key.yaml
risk_class: low
repair_mode: preview-backed
preview_diff: |
  diff --git a/examples/fixtures/invalid/harness-with-plugin-key.yaml b/examples/fixtures/invalid/harness-with-plugin-key.yaml
  --- a/examples/fixtures/invalid/harness-with-plugin-key.yaml
  +++ b/examples/fixtures/invalid/harness-with-plugin-key.yaml
  @@ -55,6 +55,3 @@
   continuity:
     state_dir: .harness/continuity
   gc:
     evidence_dir: .harness/gc
  -plugins:
  -  copilot:
  -    enabled: true
equivalent_cli_command:
  command: |
    mkdir -p .harness/repairs && cat > .harness/repairs/approved-schema-fix.patch <<'PATCH'
    diff --git a/examples/fixtures/invalid/harness-with-plugin-key.yaml b/examples/fixtures/invalid/harness-with-plugin-key.yaml
    --- a/examples/fixtures/invalid/harness-with-plugin-key.yaml
    +++ b/examples/fixtures/invalid/harness-with-plugin-key.yaml
    @@ -55,6 +55,3 @@
     continuity:
       state_dir: .harness/continuity
     gc:
       evidence_dir: .harness/gc
    -plugins:
    -  copilot:
    -    enabled: true
    PATCH
  timeout_seconds: 300
approval_state: approved
sandbox_requirement: worktree
trust_requirements:
  trust_level: sandboxed
  sandbox_required: worktree
  network_access: false
  secret_access: false
  host_file_access: false
  allowed_inputs:
    - examples/fixtures/invalid/harness-with-plugin-key.yaml
  allowed_outputs:
    - .harness/repairs/approved-schema-fix.patch
rollback_notes: Delete the generated patch if the repair is rejected, or reverse-apply it if the preview is applied and later fails validation.
evidence_links:
  - path: examples/fixtures/invalid/harness-with-plugin-key.yaml
    media_type: application/yaml
    description: Target invalid harness fixture.
  - path: .harness/repairs/approved-schema-fix.patch
    media_type: text/x-diff
    description: Reproducible preview patch produced by the equivalent command.
